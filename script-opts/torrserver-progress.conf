# Exact TorrServer origin(s) used by your playback links; separate aliases with commas.
# Replace this example with your own server. Unlisted servers are ignored.
servers=http://127.0.0.1:8090

# IINA improvements: enabled by default. Use yes/no for each feature.
playlist=yes
audio_memory_enabled=yes
progress=yes

# Server cache integration: explicit opt-in, even if URL/token are configured.
server_cache=no

# Audio preferences are stored inside IINA's selected configuration directory.
# audio_memory=~~/torrserver-audio.json

# Optional persistent cache companion, running on the TorrServer machine.
# companion_url=http://torrserver.local:8092
# companion_token=the_same_random_token_as_in_companion_config
